<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Cuenta - PROBJJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        /* Fondo decorativo */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            top: -100px;
            left: -100px;
            z-index: 1;
        }

        body::after {
            content: '';
            position: absolute;
            width: 300px;
            height: 300px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 50%;
            bottom: -50px;
            right: -50px;
            z-index: 1;
        }

        .register-container {
            width: 100%;
            max-width: 700px;
            z-index: 10;
            position: relative;
        }

        .register-card {
            background: white;
            border-radius: 20px;
            padding: 50px 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(10px);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .register-header {
            text-align: center;
            margin-bottom: 40px;
            position: relative;
        }

        .register-header .logo {
            font-size: 48px;
            margin-bottom: 15px;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 100% {
                transform: translateY(0);
            }
            50% {
                transform: translateY(-10px);
            }
        }

        .register-header h1 {
            color: #333;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .register-header .subtitle {
            color: #999;
            font-size: 15px;
            font-weight: 400;
            letter-spacing: 0.5px;
        }

        .error-message {
            background: linear-gradient(135deg, #ff6b6b 0%, #ee5a6f 100%);
            color: white;
            padding: 15px 18px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(255, 107, 107, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            animation: shake 0.5s ease-out;
        }

        .success-message {
            background: linear-gradient(135deg, #51cf66 0%, #37b24d 100%);
            color: white;
            padding: 15px 18px;
            border-radius: 12px;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(81, 207, 102, 0.3);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes shake {
            0%, 100% {
                transform: translateX(0);
            }
            25% {
                transform: translateX(-10px);
            }
            75% {
                transform: translateX(10px);
            }
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 20px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
            letter-spacing: 0.3px;
        }

        .form-group label .required {
            color: #ff6b6b;
        }

        .form-group input {
            padding: 14px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
            transform: translateY(-2px);
        }

        .form-group input:hover {
            border-color: #ddd;
        }

        .btn-container {
            margin-top: 35px;
            display: flex;
            gap: 12px;
        }

        .register-btn {
            flex: 1;
            padding: 15px 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .register-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        .register-btn:active {
            transform: translateY(-1px);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
        }

        .register-footer {
            text-align: center;
            margin-top: 30px;
            padding-top: 25px;
            border-top: 1px solid #f0f0f0;
            font-size: 14px;
            color: #666;
        }

        .register-footer a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            border-bottom: 2px solid transparent;
        }

        .register-footer a:hover {
            color: #764ba2;
            border-bottom-color: #764ba2;
        }

        .info-box {
            background: linear-gradient(135deg, #f0f4ff 0%, #f8f1ff 100%);
            border-left: 4px solid #667eea;
            padding: 16px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }

        .info-box strong {
            color: #333;
        }

        @media (max-width: 768px) {
            .register-card {
                padding: 35px 25px;
            }

            .register-header h1 {
                font-size: 26px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 15px;
            }

            .btn-container {
                flex-direction: column;
            }

            body::before {
                width: 300px;
                height: 300px;
                top: -80px;
                left: -80px;
            }

            body::after {
                width: 200px;
                height: 200px;
            }
        }

        @media (max-width: 480px) {
            .register-card {
                padding: 30px 20px;
            }

            .register-header h1 {
                font-size: 24px;
            }

            .register-header .logo {
                font-size: 40px;
            }

            .form-group input {
                padding: 12px 14px;
                font-size: 13px;
            }
        }
    </style>
</head>
<body>
    <div class="register-container">
        <div class="register-card">
            <!-- HEADER -->
            <div class="register-header">
                <div class="logo">🥋</div>
                <h1>Crear Cuenta</h1>
                <p class="subtitle">Únete a la comunidad de entrenadores BJJ</p>
            </div>

            <!-- ERROR MESSAGE -->
            <div th:if="${error}" class="error-message">
                <span>❌</span>
                <span th:text="${error}"></span>
            </div>

            <!-- SUCCESS MESSAGE -->
            <div th:if="${success}" class="success-message">
                <span>✅</span>
                <span th:text="${success}"></span>
            </div>

            <!-- INFO BOX -->
            <div class="info-box">
                <strong>📋 Información Requerida:</strong> Completa todos los campos con * para crear tu cuenta. El apellido y dirección son opcionales.
            </div>

            <!-- FORM -->
            <form action="/register" method="post">
                <!-- RUT y EDAD -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="rut">RUT <span class="required">*</span></label>
                        <input type="text" id="rut" name="rut" required placeholder="12345678-K">
                    </div>
                    <div class="form-group">
                        <label for="edad">Edad (años) <span class="required">*</span></label>
                        <input type="number" id="edad" name="edad" required min="13" max="120" placeholder="18">
                    </div>
                </div>

                <!-- NOMBRE y APELLIDO -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre <span class="required">*</span></label>
                        <input type="text" id="nombre" name="nombre" required placeholder="Juan">
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" placeholder="Pérez">
                    </div>
                </div>

                <!-- ESTATURA y EMAIL -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="estatura">Estatura (cm) <span class="required">*</span></label>
                        <input type="number" id="estatura" name="estatura" required min="100" max="250" step="0.1" placeholder="170">
                    </div>
                    <div class="form-group">
                        <label for="email">Email <span class="required">*</span></label>
                        <input type="email" id="email" name="email" required placeholder="tu@email.com">
                    </div>
                </div>

                <!-- DIRECCIÓN -->
                <div class="form-row full">
                    <div class="form-group">
                        <label for="direccion">Dirección</label>
                        <input type="text" id="direccion" name="direccion" placeholder="Calle Principal 123, Apartamento 4">
                    </div>
                </div>

                <!-- CONTRASEÑAS -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="password">Contraseña <span class="required">*</span></label>
                        <input type="password" id="password" name="password" required placeholder="Mínimo 6 caracteres">
                    </div>
                    <div class="form-group">
                        <label for="confirmPassword">Confirmar Contraseña <span class="required">*</span></label>
                        <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Repite tu contraseña">
                    </div>
                </div>

                <!-- BUTTONS -->
                <div class="btn-container">
                    <button type="submit" class="register-btn">✨ Crear Cuenta</button>
                    <button type="reset" class="register-btn btn-secondary">🔄 Limpiar</button>
                </div>
            </form>

            <!-- FOOTER -->
            <div class="register-footer">
                ¿Ya tienes cuenta? 
                <a href="/login">Inicia sesión aquí</a>
            </div>
        </div>
    </div>
</body>
</html>
