<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mi Perfil - PROBJJ</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
    <style>
        .perfil-container {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        
        .perfil-header {
            text-align: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid #4CAF50;
        }
        
        .perfil-header h1 {
            color: #4CAF50;
            margin-bottom: 10px;
        }
        
        .perfil-avatar {
            width: 120px;
            height: 120px;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            border-radius: 50%;
            margin: 0 auto 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            color: white;
            font-weight: bold;
        }
        
        .perfil-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }
        
        .info-card {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 10px;
            border-left: 4px solid #4CAF50;
        }
        
        .info-card label {
            display: block;
            font-size: 12px;
            color: #666;
            text-transform: uppercase;
            margin-bottom: 5px;
            font-weight: 600;
        }
        
        .info-card .value {
            font-size: 18px;
            color: #333;
            font-weight: 500;
        }
        
        .perfil-actions {
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
            margin-top: 30px;
        }
        
        .btn {
            padding: 12px 30px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s;
        }
        
        .btn-primary {
            background: #4CAF50;
            color: white;
        }
        
        .btn-primary:hover {
            background: #45a049;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .btn-secondary {
            background: #2196F3;
            color: white;
        }
        
        .btn-secondary:hover {
            background: #0b7dda;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .btn-danger {
            background: #f44336;
            color: white;
        }
        
        .btn-danger:hover {
            background: #da190b;
            transform: translateY(-2px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.2);
        }
        
        .welcome-message {
            text-align: center;
            background: linear-gradient(135deg, #4CAF50, #45a049);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 30px;
            font-size: 18px;
        }
        
        .success-banner {
            background: linear-gradient(135deg, #51cf66 0%, #37b24d 100%);
            color: white;
            padding: 20px;
            border-radius: 10px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 16px;
            font-weight: 500;
            box-shadow: 0 4px 15px rgba(81, 207, 102, 0.4);
            animation: slideIn 0.6s ease-out;
        }
        
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    
    <div class="perfil-container">
        <div class="success-banner" th:if="${success}">
            ✅ <span th:text="${success}"></span>
        </div>
        
        <div class="welcome-message">
            <h2>¡Bienvenido a tu perfil, <span th:text="${usuario.nombre}"></span>!</h2>
            <p>Esta es tu información personal</p>
        </div>
        
        <div class="perfil-header">
            <div class="perfil-avatar" th:text="${#strings.toUpperCase(#strings.substring(usuario.nombre, 0, 1))}">P</div>
            <h1><span th:text="${usuario.nombre}"></span> <span th:text="${usuario.apellido}"></span></h1>
            <p style="color: #666; font-size: 14px;" th:text="${usuario.rol}">USER</p>
        </div>
        
        <div class="perfil-info">
            <div class="info-card">
                <label>RUT</label>
                <div class="value" th:text="${usuario.rut}">12345678-9</div>
            </div>
            
            <div class="info-card">
                <label>Email</label>
                <div class="value" th:text="${usuario.email}">email@example.com</div>
            </div>
            
            <div class="info-card">
                <label>Edad</label>
                <div class="value"><span th:text="${usuario.edad}"></span> años</div>
            </div>
            
            <div class="info-card">
                <label>Estatura</label>
                <div class="value"><span th:text="${usuario.estatura}"></span> cm</div>
            </div>
            
            <div class="info-card" style="grid-column: 1 / -1;">
                <label>Dirección</label>
                <div class="value" th:text="${usuario.direccion}">Dirección completa</div>
            </div>
        </div>
        
        <div class="perfil-actions">
            <a href="/" class="btn btn-primary">Ir al Inicio</a>
            <a href="/actividad" class="btn btn-secondary">Mis Actividades</a>
            <a href="/competencia" class="btn btn-secondary">Mis Competencias</a>
            <a href="/nutrition" class="btn btn-secondary">Nutrición</a>
            <a href="/logout" class="btn btn-danger">Cerrar Sesión</a>
        </div>
    </div>
</body>
</html>
