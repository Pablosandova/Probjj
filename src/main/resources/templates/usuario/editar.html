<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Usuario - PROBJJ</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .navbar {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: white;
            padding: 15px 30px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.1);
            z-index: 1000;
        }

        .navbar a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            margin: 0 15px;
            transition: all 0.3s ease;
        }

        .navbar a:hover {
            color: #764ba2;
        }

        .container {
            width: 100%;
            max-width: 600px;
            margin-top: 100px;
        }

        .edit-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            animation: slideUp 0.6s ease-out;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .edit-header {
            text-align: center;
            margin-bottom: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 32px;
            font-weight: 700;
        }

        .edit-header-text h1 {
            color: #333;
            font-size: 24px;
            margin-bottom: 5px;
        }

        .edit-header-text p {
            color: #999;
            font-size: 14px;
        }

        .success-message {
            background: linear-gradient(135deg, #51cf66 0%, #37b24d 100%);
            color: white;
            padding: 15px 18px;
            border-radius: 12px;
            margin-bottom: 25px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            font-weight: 500;
            animation: slideDown 0.5s ease-out;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 18px;
            margin-bottom: 20px;
        }

        .form-row.full {
            grid-template-columns: 1fr;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: 600;
            font-size: 14px;
        }

        .form-group input {
            padding: 14px 16px;
            border: 2px solid #e8e8e8;
            border-radius: 10px;
            font-size: 14px;
            font-family: 'Poppins', sans-serif;
            transition: all 0.3s ease;
            background: #f9f9f9;
        }

        .form-group input::placeholder {
            color: #bbb;
        }

        .form-group input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.15);
        }

        .btn-container {
            margin-top: 35px;
            display: flex;
            gap: 12px;
        }

        .btn {
            flex: 1;
            padding: 15px 24px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Poppins', sans-serif;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 12px 30px rgba(102, 126, 234, 0.4);
        }

        .btn-secondary {
            background: #f0f0f0;
            color: #333;
            box-shadow: none;
        }

        .btn-secondary:hover {
            background: #e0e0e0;
        }

        .info-box {
            background: linear-gradient(135deg, #f0f4ff 0%, #f8f1ff 100%);
            border-left: 4px solid #667eea;
            padding: 16px 18px;
            border-radius: 10px;
            margin-bottom: 20px;
            font-size: 13px;
            color: #555;
            line-height: 1.6;
        }

        @media (max-width: 768px) {
            .edit-card {
                padding: 25px;
            }

            .form-row {
                grid-template-columns: 1fr;
            }

            .btn-container {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <!-- NAVBAR -->
    <div class="navbar">
        <a href="/">🥋 PROBJJ</a>
        <a href="/usuario/">👥 Usuarios</a>
        <a href="/logout">Salir</a>
    </div>

    <div class="container">
        <div class="edit-card">
            <!-- HEADER -->
            <div class="edit-header">
                <div class="avatar" th:text="${usuario.getNombre().charAt(0)}"></div>
                <div class="edit-header-text">
                    <h1>Editar Usuario</h1>
                    <p th:text="${usuario.getNombre() + ' ' + usuario.getApellido()}"></p>
                </div>
            </div>

            <!-- SUCCESS MESSAGE -->
            <div th:if="${mensaje}" class="success-message">
                <span>✅</span>
                <span th:text="${mensaje}"></span>
            </div>

            <!-- INFO BOX -->
            <div class="info-box">
                <strong>📝 Información:</strong> Actualiza los datos del usuario. Los cambios se guardarán en la base de datos e import.sql automáticamente.
            </div>

            <!-- FORM -->
            <form th:action="@{/usuario/actualizar/{id}(id=${usuario.getId()})}" method="post">
                <!-- NOMBRE y APELLIDO -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="nombre">Nombre</label>
                        <input type="text" id="nombre" name="nombre" th:value="${usuario.getNombre()}" required>
                    </div>
                    <div class="form-group">
                        <label for="apellido">Apellido</label>
                        <input type="text" id="apellido" name="apellido" th:value="${usuario.getApellido()}" required>
                    </div>
                </div>

                <!-- EMAIL y EDAD -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" th:value="${usuario.getEmail()}" required>
                    </div>
                    <div class="form-group">
                        <label for="edad">Edad (años)</label>
                        <input type="number" id="edad" name="edad" th:value="${usuario.getEdad()}" min="13" max="120" required>
                    </div>
                </div>

                <!-- ESTATURA y DIRECCIÓN -->
                <div class="form-row">
                    <div class="form-group">
                        <label for="estatura">Estatura (cm)</label>
                        <input type="number" id="estatura" name="estatura" th:value="${usuario.getEstatura()}" min="100" max="250" step="0.1" required>
                    </div>
                    <div class="form-group">
                        <label for="direccion">Dirección</label>
                        <input type="text" id="direccion" name="direccion" th:value="${usuario.getDireccion()}" required>
                    </div>
                </div>

                <!-- BUTTONS -->
                <div class="btn-container">
                    <button type="submit" class="btn btn-primary">💾 Guardar Cambios</button>
                    <a href="/usuario/" class="btn btn-secondary">↩️ Cancelar</a>
                </div>
            </form>

            <!-- READ-ONLY INFO -->
            <div class="info-box" style="margin-top: 30px; background: #f8f8f8; border-left-color: #999;">
                <strong>📊 Información del Sistema:</strong><br>
                RUT: <span th:text="${usuario.getRut()}"></span><br>
                Rol: <span th:text="${usuario.getRol()}"></span><br>
                Creado: <span th:text="${#dates.format(usuario.getCreatAt(), 'dd/MM/yyyy HH:mm')}"></span>
            </div>
        </div>
    </div>
</body>
</html>
